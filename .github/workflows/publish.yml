name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A82F27: ${{ secrets.A82F27 }}
          B6AFF6: ${{ secrets.B6AFF6 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A82F27', '')
          meta_b = os.environ.get('B6AFF6', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 4774213b29c1dd2f10140c861219cd8c2f -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 5070ad2223a19d8878d758ebeb144a083441d46df794558c -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
